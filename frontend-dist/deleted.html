<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Image Removed</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#fafafa;font-family:'Inter',sans-serif;color:#1a1a1a;
    overflow:hidden;
  }
  .container{
    text-align:center;padding:40px 24px;max-width:480px;position:relative;
  }
  /* Decorative thin lines */
  .line-top,.line-bottom{
    width:60px;height:1px;background:#1a1a1a;margin:0 auto;
  }
  .line-top{margin-bottom:32px}
  .line-bottom{margin-top:32px}
  /* Icon area */
  .icon-wrap{
    width:120px;height:120px;margin:0 auto 28px;
    border:1.5px solid #d0d0d0;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .icon-wrap::after{
    content:'';position:absolute;
    width:140px;height:140px;border:1px solid #e8e8e8;border-radius:50%;
    top:-11px;left:-11px;
  }
  .icon-wrap svg{
    width:42px;height:42px;stroke:#999;stroke-width:1.5;
    fill:none;stroke-linecap:round;stroke-linejoin:round;
  }
  /* Typography */
  .title{
    font-family:'Playfair Display',serif;font-size:28px;
    font-weight:700;letter-spacing:2px;text-transform:uppercase;
    margin-bottom:8px;color:#1a1a1a;
  }
  .subtitle{
    font-family:'Playfair Display',serif;font-size:14px;
    font-style:italic;color:#888;letter-spacing:1px;
    margin-bottom:24px;
  }
  .desc{
    font-size:13px;line-height:1.8;color:#999;
    font-weight:300;letter-spacing:0.3px;
    max-width:320px;margin:0 auto;
  }
  .code{
    display:inline-block;margin-top:20px;
    font-family:'Inter',monospace;font-size:11px;
    color:#bbb;letter-spacing:4px;text-transform:uppercase;
  }
  /* Subtle background texture */
  .grain{
    position:fixed;top:0;left:0;width:100%;height:100%;
    opacity:0.03;pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  /* Dark mode */
  @media(prefers-color-scheme:dark){
    body{background:#111;color:#e0e0e0}
    .line-top,.line-bottom{background:#e0e0e0}
    .icon-wrap{border-color:#444}
    .icon-wrap::after{border-color:#333}
    .icon-wrap svg{stroke:#666}
    .title{color:#e0e0e0}
    .subtitle{color:#777}
    .desc{color:#666}
    .code{color:#555}
  }
</style>
</head>
<body>
<div class="grain"></div>
<div class="container">
  <div class="line-top"></div>
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
      <line x1="4" y1="4" x2="20" y2="20" stroke-width="1.5"/>
    </svg>
  </div>
  <div class="title">Removed</div>
  <div class="subtitle">This image has been deleted</div>
  <p class="desc">
    该图片已被删除，链接已永久失效。<br>
    The requested image has been permanently removed and is no longer available.
  </p>
  <div class="line-bottom"></div>
  <span class="code">404 — gone</span>
</div>
</body>
</html>
